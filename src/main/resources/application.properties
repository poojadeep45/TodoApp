spring.application.name=todoapp

# Each falls back to your existing local values if the environment variable isn't set,
# so this file works unchanged for local dev AND inside Docker (where docker-compose sets these).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/todo-app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update