<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body { background-color: #f4f6f8; }
        .login-card { max-width: 400px; margin: 5rem auto; }
    </style>
</head>
<body>
<div class="login-card card shadow-sm">
    <div class="card-body p-4">
        <h3 class="text-center fw-bold mb-4">📝 Todo Application</h3>

        <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-info">You've been logged out.</div>
        <div th:if="${param.registered}" class="alert alert-success">Account created — please log in.</div>

        <form th:action="@{/login}" method="post" autocomplete="off">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="app-username" class="form-control" autocomplete="new-password"
                       readonly onfocus="this.removeAttribute('readonly');" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="app-password" class="form-control" autocomplete="new-password"
                       readonly onfocus="this.removeAttribute('readonly');" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>

        <p class="text-center mt-3 mb-0">
            <a th:href="@{/register}">Need an account? Register</a>
        </p>
    </div>
</div>
</body>
</html>
