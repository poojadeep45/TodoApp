<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        html, body { height: 100%; }
        body { margin: 0; }
        .auth-wrapper { display: flex; min-height: 100vh; }
        .auth-side-panel {
            flex: 1 1 45%;
            background: linear-gradient(135deg, #0d47a1 0%, #1565c0 55%, #1e88e5 100%);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 3rem;
        }
        .auth-side-content { max-width: 420px; margin: 0 auto; }
        .auth-brand { font-weight: 700; font-size: 1.75rem; margin-bottom: 0.75rem; }
        .auth-tagline { opacity: 0.9; margin-bottom: 2rem; }
        .auth-feature-list { list-style: none; padding: 0; margin: 0; }
        .auth-feature-list li { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; opacity: 0.95; }
        .auth-feature-list i { font-size: 1.1rem; }
        .auth-form-panel {
            flex: 1 1 55%;
            background-color: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-form-card { width: 100%; max-width: 400px; }
        .auth-form-title { font-weight: 700; margin-bottom: 1.5rem; }
        @media (max-width: 767px) {
            .auth-side-panel { display: none; }
            .auth-form-panel { flex: 1 1 100%; }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/auth-layout :: layout('Welcome back', 'Log in to keep your tasks moving.', ~{::#auth-content})}">
    <div id="auth-content">

        <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
        <div th:if="${param.locked}" class="alert alert-warning">Too many failed attempts. This account is locked for 15 minutes.</div>
        <div th:if="${param.logout}" class="alert alert-info">You've been logged out.</div>
        <div th:if="${param.registered}" class="alert alert-success">Account created — please log in.</div>
        <div th:if="${param.resetSuccess}" class="alert alert-success">Password reset — please log in with your new password.</div>

        <form th:action="@{/login}" method="post" autocomplete="off">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="app-username" class="form-control" autocomplete="new-password"
                       readonly onfocus="this.removeAttribute('readonly');" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" id="loginPassword" name="app-password" class="form-control" autocomplete="new-password"
                           readonly onfocus="this.removeAttribute('readonly');" required>
                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('loginPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="mb-3 form-check d-flex justify-content-between align-items-center">
                <div>
                    <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a th:href="@{/forgot-password}" class="small">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>

        <p class="text-center mt-3 mb-0">
            <a th:href="@{/register}">Need an account? Register</a>
        </p>

    </div>
</div>

<script>
    function togglePassword(fieldId, button) {
        const field = document.getElementById(fieldId);
        const icon = button.querySelector('i');
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
</script>
</body>
</html>
