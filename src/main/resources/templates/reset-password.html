<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password - Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        html, body { height: 100%; }
        body { margin: 0; }
        .auth-wrapper { display: flex; min-height: 100vh; }
        .auth-side-panel {
            flex: 1 1 45%;
            background: linear-gradient(135deg, #0d47a1 0%, #1565c0 55%, #1e88e5 100%);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 3rem;
        }
        .auth-side-content { max-width: 420px; margin: 0 auto; }
        .auth-brand { font-weight: 700; font-size: 1.75rem; margin-bottom: 0.75rem; }
        .auth-tagline { opacity: 0.9; margin-bottom: 2rem; }
        .auth-feature-list { list-style: none; padding: 0; margin: 0; }
        .auth-feature-list li { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; opacity: 0.95; }
        .auth-feature-list i { font-size: 1.1rem; }
        .auth-form-panel {
            flex: 1 1 55%;
            background-color: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-form-card { width: 100%; max-width: 400px; }
        .auth-form-title { font-weight: 700; margin-bottom: 1.5rem; }
        @media (max-width: 767px) {
            .auth-side-panel { display: none; }
            .auth-form-panel { flex: 1 1 100%; }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/auth-layout :: layout('Set a new password', 'Almost there — choose a new password to finish.', ~{::#auth-content})}">
    <div id="auth-content">

        <div th:if="${!tokenValid}" class="alert alert-danger">
            This reset link is invalid or has expired. <a th:href="@{/forgot-password}">Request a new one</a>.
        </div>

        <form th:if="${tokenValid}" th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post" autocomplete="off">
            <input type="hidden" th:field="*{token}"/>
            <div class="mb-3">
                <label class="form-label">New password</label>
                <div class="input-group">
                    <input type="password" id="newPassword" class="form-control" th:field="*{newPassword}" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('newPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="form-text">At least 15 characters, with uppercase, lowercase, a number, and a special character.</div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm new password</label>
                <div class="input-group">
                    <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirmPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Reset password</button>
        </form>

        <p class="text-center mt-3 mb-0">
            <a th:href="@{/login}">Back to log in</a>
        </p>

    </div>
</div>

<script>
    function togglePassword(fieldId, button) {
        const field = document.getElementById(fieldId);
        const icon = button.querySelector('i');
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
</script>
</body>
</html>
